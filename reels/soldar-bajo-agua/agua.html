<!doctype html>
<html><head><meta charset="utf-8">
<style>
@font-face{font-family:P;src:url(poppins800.ttf);font-weight:800}
@font-face{font-family:P;src:url(poppins900.ttf);font-weight:900}
html,body{margin:0;background:#000;width:1080px;height:1920px;overflow:hidden}
svg{display:block}
text{font-family:P;font-weight:900}
</style></head>
<body>
<svg id="s" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1080" height="1920" viewBox="0 0 1080 1920"></svg>
<script src="timing.js"></script><script>
const O='#1E1B3A', SW=6;
const SKIN='#F2C094';
const clamp=(x,a,b)=>Math.max(a,Math.min(b,x));
const lin=(t,a,b)=>clamp((t-a)/(b-a),0,1);
const mix=(a,b,k)=>a+(b-a)*k;
const eOut=x=>1-Math.pow(1-x,3);
const eIn=x=>x*x*x;
const eIO=x=>x<.5?4*x*x*x:1-Math.pow(-2*x+2,3)/2;
const bOut=x=>{const c1=2.2,c3=c1+1;return 1+c3*Math.pow(x-1,3)+c1*Math.pow(x-1,2)};
const pop=(t,t0,d=.35)=>t<t0?0:bOut(lin(t,t0,t0+d));
const shake=(t,t0,amp=18,d=.45)=>{if(t<t0||t>t0+d)return 0;const k=1-(t-t0)/d;return Math.sin((t-t0)*95)*amp*k};
function rnd(i){const x=Math.sin(i*127.1+311.7)*43758.5453;return x-Math.floor(x)}
const esc=s=>s.replace(/&/g,'&amp;').replace(/</g,'&lt;');

/* ---------- text helpers ---------- */
function txt(x,y,s,size,fill='#fff',anchor='middle',extra=''){
  return `<text x="${x}" y="${y}" font-size="${size}" fill="${fill}" text-anchor="${anchor}" stroke="${O}" stroke-width="${Math.max(6,size*.16)}" stroke-linejoin="round" paint-order="stroke" ${extra}>${esc(s)}</text>`;
}
function tw(s,size){return s.length*size*.66}

/* ---------- defs ---------- */
const DEFS=`<defs>
<pattern id="dots" width="26" height="26" patternUnits="userSpaceOnUse"><circle cx="13" cy="13" r="2.6" fill="rgba(0,0,0,.16)"/></pattern>
<pattern id="haz" width="44" height="20" patternUnits="userSpaceOnUse"><rect width="44" height="20" fill="#F5C518"/><path d="M0 20 L14 0 L28 0 L14 20Z" fill="#1E1B3A"/><path d="M30 20 L44 0 L44 20Z" fill="#1E1B3A"/></pattern>
<radialGradient id="flash"><stop offset="0" stop-color="#fff" stop-opacity="1"/><stop offset=".35" stop-color="#E8FBFF" stop-opacity=".85"/><stop offset="1" stop-color="#9FE8FF" stop-opacity="0"/></radialGradient>
<radialGradient id="glow"><stop offset="0" stop-color="#FFE38A" stop-opacity=".9"/><stop offset="1" stop-color="#FF8C1A" stop-opacity="0"/></radialGradient>
<radialGradient id="ctaBg" cx=".5" cy=".42" r=".75"><stop offset="0" stop-color="#14505C"/><stop offset=".6" stop-color="#0B2A33"/><stop offset="1" stop-color="#05141A"/></radialGradient>
<clipPath id="cTop"><rect x="0" y="0" width="1080" height="900"/></clipPath>
<clipPath id="cBot"><rect x="0" y="1020" width="1080" height="900"/></clipPath>
</defs>`;

/* ---------- background ---------- */
function panel(y0,h,col,floorY,floorCol){
  let s=`<rect x="0" y="${y0}" width="1080" height="${h}" fill="${col}"/>`;
  s+=`<rect x="0" y="${y0}" width="1080" height="${floorY-y0}" fill="url(#dots)"/>`;
  for(let i=0;i<8;i++){const x=40+i*140+(i%2)*30, yy=y0+70+(i%3)*22;
    s+=`<g fill="rgba(0,0,0,.17)"><circle cx="${x+7}" cy="${yy}" r="11"/><rect x="${x}" y="${yy}" width="14" height="${70+(i%3)*18}" rx="6"/></g>`;}
  s+=`<rect x="0" y="${floorY}" width="1080" height="${y0+h-floorY}" fill="${floorCol}"/>`;
  s+=`<rect x="0" y="${floorY-2}" width="1080" height="20" fill="url(#haz)"/>`;
  s+=`<rect x="0" y="${floorY+18}" width="1080" height="6" fill="rgba(0,0,0,.2)"/>`;
  return s;
}

/* ---------- character ---------- */
function armPoint(o,px,py){
  const a=(o.armR||-20)*Math.PI/180, dx=px-205, dy=py-275;
  const rx=205+dx*Math.cos(a)-dy*Math.sin(a), ry=275+dx*Math.sin(a)+dy*Math.cos(a);
  return [o.x+(rx-150)*o.s, o.y+(ry-520)*o.s+(o.hop||0)];
}
function localPt(o,px,py){return [o.x+(px-150)*o.s, o.y+(py-520)*o.s+(o.hop||0)]}

function eyes(o,t){
  const ex=o.lookX||0, ey=o.lookY||0; let s='';
  const e=o.expr||'happy';
  if(e==='pain'){
    s+=`<path d="M100 150 L132 166 L100 182" fill="none" stroke="${O}" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>`;
    s+=`<path d="M200 150 L168 166 L200 182" fill="none" stroke="${O}" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>`;
  } else if(e==='cough'){
    s+=`<path d="M98 166 Q118 152 138 166" fill="none" stroke="${O}" stroke-width="8" stroke-linecap="round"/>`;
    s+=`<path d="M162 166 Q182 152 202 166" fill="none" stroke="${O}" stroke-width="8" stroke-linecap="round"/>`;
  } else {
    const red=e==='cry';
    const pr=e==='scared'?6:10;
    for(const cx of [118,182]){
      s+=`<circle cx="${cx}" cy="165" r="25" fill="${red?'#FFB0B0':'#fff'}" stroke="${O}" stroke-width="${SW}"/>`;
      if(red){s+=`<path d="M${cx-20} 160 l8 3 l5 -4 M${cx+20} 170 l-8 -2 l-4 5" stroke="#D62839" stroke-width="2.5" fill="none"/>`;}
      s+=`<circle cx="${cx+ex}" cy="${167+ey}" r="${pr}" fill="${O}"/>`;
      if(!red)s+=`<circle cx="${cx+ex+3}" cy="${163+ey}" r="3" fill="#fff"/>`;
    }
    if(e==='smug'){
      s+=`<path d="M92 165 A26 26 0 0 1 144 165 Z" fill="${SKIN}" stroke="${O}" stroke-width="${SW}"/>`;
      s+=`<path d="M156 165 A26 26 0 0 1 208 165 Z" fill="${SKIN}" stroke="${O}" stroke-width="${SW}"/>`;
    }
    if(red){ // tears
      for(const [cx,ph] of [[100,0],[200,.5]]){const k=((t*1.6+ph)%1);
        s+=`<path d="M${cx} ${185+k*70} q-9 14 0 20 q9 -6 0 -20Z" fill="#5BC0EB" stroke="${O}" stroke-width="3" opacity="${1-k*.6}"/>`;}
    }
  }
  return s;
}
function mouth(o){
  const e=o.expr||'happy';
  if(e==='happy')return `<path d="M112 208 Q150 258 188 208 Z" fill="#7A1F2B" stroke="${O}" stroke-width="${SW}" stroke-linejoin="round"/><path d="M128 230 Q150 246 172 230 Q150 222 128 230Z" fill="#F07C8C"/><path d="M118 210 L182 210" stroke="#fff" stroke-width="7"/>`;
  if(e==='smug')return `<path d="M118 214 Q160 240 190 206" fill="none" stroke="${O}" stroke-width="7" stroke-linecap="round"/>`;
  if(e==='pain')return `<ellipse cx="150" cy="226" rx="30" ry="24" fill="#7A1F2B" stroke="${O}" stroke-width="${SW}"/><path d="M124 216 L176 216" stroke="#fff" stroke-width="7"/>`;
  if(e==='cough')return `<ellipse cx="150" cy="224" rx="15" ry="14" fill="#7A1F2B" stroke="${O}" stroke-width="${SW}"/>`;
  if(e==='scared')return `<path d="M114 226 q9 -12 18 0 q9 12 18 0 q9 -12 18 0 q9 12 18 0" fill="none" stroke="${O}" stroke-width="7" stroke-linecap="round"/>`;
  if(e==='cry')return `<path d="M118 236 Q150 206 182 236" fill="none" stroke="${O}" stroke-width="7" stroke-linecap="round"/>`;
  return '';
}
function character(o,t){
  const pro=o.type==='pro', s=o.s, hop=o.hop||0;
  const sq=o.sq||0;
  let g=`<g transform="translate(${o.x-150*s} ${o.y-520*s+hop}) scale(${s}) translate(150 520) scale(${1+sq} ${1-sq}) translate(-150 -520)" stroke-linejoin="round">`;
  g+=`<ellipse cx="150" cy="520" rx="${110-Math.min(60,-hop*.6)}" ry="14" fill="rgba(0,0,0,.25)" transform="translate(0 ${-hop/s})"/>`;
  // crutch behind
  if(o.bandage){g+=`<g stroke="${O}" stroke-width="${SW}"><rect x="252" y="300" width="18" height="222" rx="8" fill="#B8C0C8"/><rect x="236" y="292" width="52" height="18" rx="8" fill="#8D99A6"/><rect x="246" y="390" width="34" height="14" rx="6" fill="#8D99A6"/></g>`;}
  // legs & feet
  if(pro){
    g+=`<rect x="108" y="398" width="38" height="96" rx="12" fill="#3E6DB5" stroke="${O}" stroke-width="${SW}"/><rect x="154" y="398" width="38" height="96" rx="12" fill="#3E6DB5" stroke="${O}" stroke-width="${SW}"/>`;
    g+=`<rect x="94" y="476" width="58" height="42" rx="18" fill="#7A4A2A" stroke="${O}" stroke-width="${SW}"/><rect x="148" y="476" width="58" height="42" rx="18" fill="#7A4A2A" stroke="${O}" stroke-width="${SW}"/>`;
    g+=`<path d="M100 506 H146 M154 506 H200" stroke="#5A3520" stroke-width="5"/>`;
  } else {
    g+=`<rect x="116" y="420" width="28" height="70" rx="10" fill="${SKIN}" stroke="${O}" stroke-width="${SW}"/><rect x="156" y="420" width="28" height="70" rx="10" fill="${SKIN}" stroke="${O}" stroke-width="${SW}"/>`;
    g+=`<rect x="100" y="392" width="100" height="52" rx="16" fill="#4A78C2" stroke="${O}" stroke-width="${SW}"/><path d="M150 400 V440" stroke="${O}" stroke-width="4"/>`;
    g+=`<rect x="96" y="478" width="56" height="40" rx="18" fill="#F4F4F4" stroke="${O}" stroke-width="${SW}"/><rect x="148" y="478" width="56" height="40" rx="18" fill="#F4F4F4" stroke="${O}" stroke-width="${SW}"/>`;
    g+=`<path d="M104 500 H144 M156 500 H196" stroke="#E63946" stroke-width="6"/>`;
  }
  // left arm
  const armL=o.armL??20;
  g+=`<g transform="rotate(${armL} 95 275)">${arm(pro,75,o,'L')}</g>`;
  // torso
  if(pro){
    g+=`<rect x="86" y="250" width="128" height="176" rx="44" fill="#3E6DB5" stroke="${O}" stroke-width="${SW}"/>`;
    g+=`<rect x="104" y="268" width="92" height="150" rx="26" fill="#C98E5A" stroke="${O}" stroke-width="${SW}"/>`;
    g+=`<rect x="114" y="282" width="16" height="70" rx="8" fill="rgba(255,255,255,.22)"/>`;
    g+=`<rect x="160" y="282" width="30" height="22" rx="4" fill="#fff" stroke="${O}" stroke-width="3"/><circle cx="168" cy="293" r="4" fill="#3E6DB5"/><path d="M175 289 H186" stroke="#E63946" stroke-width="3"/>`;
  } else {
    g+=`<rect x="90" y="252" width="120" height="172" rx="44" fill="#A3A9B0" stroke="${O}" stroke-width="${SW}"/>`;
    g+=`<path d="M128 256 Q150 276 172 256" fill="none" stroke="${O}" stroke-width="5"/>`;
    const m=o.melt||0;
    const holes=[[122,300,16],[175,330,20],[140,370,18],[185,292,12],[112,350,13],[160,400,14]];
    holes.forEach((h,i)=>{const k=lin(m,i/holes.length,(i+1)/holes.length);if(k<=0)return;
      g+=`<ellipse cx="${h[0]}" cy="${h[1]}" rx="${h[2]*k}" ry="${h[2]*.8*k}" fill="#5B3A29" stroke="#FF8C1A" stroke-width="4"/>`;
      g+=`<path d="M${h[0]-6} ${h[1]+h[2]*.7*k} q6 ${18*k} 12 0" fill="#7E8389" stroke="${O}" stroke-width="3"/>`;});
    if(o.bandage){g+=`<path d="M92 300 L210 300 L150 380 Z" fill="#F5F5F5" stroke="${O}" stroke-width="${SW}"/>`;}
  }
  // head
  g+=`<circle cx="62" cy="178" r="18" fill="${SKIN}" stroke="${O}" stroke-width="${SW}"/><circle cx="238" cy="178" r="18" fill="${SKIN}" stroke="${O}" stroke-width="${SW}"/>`;
  g+=`<circle cx="150" cy="170" r="88" fill="${SKIN}" stroke="${O}" stroke-width="${SW}"/>`;
  if(o.green)g+=`<circle cx="150" cy="170" r="85" fill="#7BC67B" opacity="${o.green*.65}"/>`;
  g+=`<circle cx="98" cy="204" r="14" fill="#F29A9A" opacity=".75"/><circle cx="202" cy="204" r="14" fill="#F29A9A" opacity=".75"/>`;
  if(!pro){
    g+=`<path d="M64 166 Q56 78 150 72 Q244 78 236 166 L224 128 L206 150 L192 108 L172 140 L152 100 L132 140 L112 106 L96 150 L78 126 Z" fill="#6B3E26" stroke="${O}" stroke-width="${SW}"/>`;
  }
  g+=eyes(o,t)+mouth(o);
  if(o.safety){g+=`<g stroke="${O}" stroke-width="4"><rect x="88" y="142" width="58" height="46" rx="14" fill="rgba(170,225,255,.45)"/><rect x="154" y="142" width="58" height="46" rx="14" fill="rgba(170,225,255,.45)"/><path d="M146 160 H154 M88 160 L66 168 M212 160 L234 168" fill="none"/></g><path d="M98 150 l14 0" stroke="#fff" stroke-width="4" opacity=".8"/>`;}
  if(o.mask){const k=o.mask;g+=`<g transform="translate(150 222) scale(${k}) translate(-150 -222)"><path d="M66 190 L100 214 M234 190 L200 214" stroke="${O}" stroke-width="5"/><ellipse cx="150" cy="224" rx="58" ry="36" fill="#E9ECEF" stroke="${O}" stroke-width="${SW}"/><circle cx="114" cy="232" r="17" fill="#F2A33A" stroke="${O}" stroke-width="4"/><circle cx="186" cy="232" r="17" fill="#F2A33A" stroke="${O}" stroke-width="4"/><path d="M140 214 H160" stroke="#B9C0C7" stroke-width="5"/></g>`;}
  if(pro){
    const v=o.visor||0;
    g+=`<rect x="70" y="96" width="160" height="30" rx="14" fill="#F2C230" stroke="${O}" stroke-width="${SW}"/>`;
    const vy=mix(38,116,v), vh=mix(62,104,v), vw=mix(144,172,v), vx=150-vw/2;
    g+=`<rect x="${vx}" y="${vy}" width="${vw}" height="${vh}" rx="24" fill="#20242F" stroke="${O}" stroke-width="${SW}"/>`;
    if(v>.5){g+=`<rect x="${vx+22}" y="${vy+24}" width="${vw-44}" height="38" rx="10" fill="#1F5A42" stroke="#0F2A20" stroke-width="3"/><path d="M${vx+30} ${vy+34} l30 0" stroke="#7CF0B5" stroke-width="5" opacity=".8"/>`;}
    else g+=`<rect x="${vx+16}" y="${vy+14}" width="28" height="8" rx="4" fill="#3DDC84"/>`;
  } else {
    const sg=o.sun??0;
    const yy=mix(96,146,sg);
    if(o.sun!==undefined){g+=`<g stroke="${O}" stroke-width="5"><rect x="88" y="${yy}" width="58" height="38" rx="14" fill="#15151C"/><rect x="154" y="${yy}" width="58" height="38" rx="14" fill="#15151C"/><path d="M146 ${yy+12} H154 M88 ${yy+12} L66 ${yy+22} M212 ${yy+12} L234 ${yy+22}" fill="none"/></g><path d="M98 ${yy+10} l16 0 M164 ${yy+10} l16 0" stroke="#fff" stroke-width="4" opacity=".7"/>`;}
  }
  if(o.bandage){g+=`<g stroke="${O}" stroke-width="${SW}"><rect x="58" y="96" width="186" height="36" rx="16" fill="#F5F5F5" transform="rotate(-8 150 114)"/><rect x="186" y="200" width="44" height="18" rx="6" fill="#F2D2A6" transform="rotate(30 208 209)"/></g><path d="M196 204 l20 10 M204 198 l-4 22" stroke="#C99B6A" stroke-width="3" transform="rotate(30 208 209)"/>`;}
  // right arm (front)
  g+=`<g transform="rotate(${o.armR??-20} 205 275)">${arm(pro,189,o,'R')}</g>`;
  if(o.sweat){g+=`<path d="M232 120 q-10 16 0 22 q10 -6 0 -22Z" fill="#8FD3FF" stroke="${O}" stroke-width="3"/>`;}
  g+=`</g>`;
  return g;
}
function arm(pro,x,o,side){
  let s='';
  const hx=x+18, hy=395;
  if(side==='R'&&o.hold==='holder'){
    s+=`<rect x="${hx-10}" y="${hy+8}" width="22" height="52" rx="8" fill="#F5C518" stroke="${O}" stroke-width="5"/><rect x="${hx-6}" y="${hy+56}" width="14" height="22" rx="4" fill="#2A2D36" stroke="${O}" stroke-width="4"/><path d="M${hx+1} ${hy+76} L${hx+1} ${hy+140}" stroke="#7E8389" stroke-width="7" stroke-linecap="round"/>`;
  }
  if(pro){
    s+=`<rect x="${x}" y="270" width="36" height="112" rx="18" fill="#E8762B" stroke="${O}" stroke-width="${SW}"/>`;
    s+=`<rect x="${x-4}" y="360" width="44" height="26" rx="10" fill="#7A4A2A" stroke="${O}" stroke-width="${SW}"/>`;
    s+=`<circle cx="${hx}" cy="${hy}" r="24" fill="#7A4A2A" stroke="${O}" stroke-width="${SW}"/>`;
  } else {
    s+=`<rect x="${x+2}" y="300" width="32" height="92" rx="16" fill="${SKIN}" stroke="${O}" stroke-width="${SW}"/>`;
    s+=`<rect x="${x-2}" y="266" width="40" height="46" rx="16" fill="#A3A9B0" stroke="${O}" stroke-width="${SW}"/>`;
    const burn=side==='R'&&o.burn;
    s+=`<circle cx="${hx}" cy="${hy}" r="21" fill="${burn?'#FF6B5B':SKIN}" stroke="${O}" stroke-width="${SW}"/>`;
  }
  return s;
}

/* ---------- props & fx ---------- */
function star(x,y,r,fill='#FFE066',rot=0){
  return `<path transform="translate(${x} ${y}) rotate(${rot})" d="M0 ${-r} Q${r*.18} ${-r*.18} ${r} 0 Q${r*.18} ${r*.18} 0 ${r} Q${-r*.18} ${r*.18} ${-r} 0 Q${-r*.18} ${-r*.18} 0 ${-r}Z" fill="${fill}"/>`;
}
function slag(x,y,mood,sc=1,rot=0){
  let s=`<g transform="translate(${x} ${y}) rotate(${rot}) scale(${sc})">`;
  s+=`<circle r="52" fill="url(#glow)"/>`;
  s+=`<path d="M-18 -18 Q-8 -54 6 -30 Q12 -60 22 -22" fill="#FFB43A" stroke="${O}" stroke-width="4"/>`;
  s+=`<circle r="30" fill="#FF8C1A" stroke="${O}" stroke-width="5"/><circle cx="-8" cy="-8" r="10" fill="#FFD36B"/>`;
  if(mood==='sad'){s+=`<circle cx="-10" cy="-2" r="6" fill="#fff" stroke="${O}" stroke-width="3"/><circle cx="10" cy="-2" r="6" fill="#fff" stroke="${O}" stroke-width="3"/><circle cx="-10" cy="1" r="3" fill="${O}"/><circle cx="10" cy="1" r="3" fill="${O}"/><path d="M-9 16 Q0 8 9 16" stroke="${O}" stroke-width="4" fill="none"/>`;}
  else {s+=`<path d="M-18 -12 L-4 -6 M18 -12 L4 -6" stroke="${O}" stroke-width="4"/><circle cx="-10" cy="0" r="6" fill="#fff" stroke="${O}" stroke-width="3"/><circle cx="10" cy="0" r="6" fill="#fff" stroke="${O}" stroke-width="3"/><circle cx="-9" cy="1" r="3" fill="${O}"/><circle cx="11" cy="1" r="3" fill="${O}"/><path d="M-12 12 Q0 24 12 12" stroke="${O}" stroke-width="4" fill="#7A1F2B"/>`;}
  return s+`</g>`;
}
function cloud(x,y,mood,sc=1,t=0){
  let s=`<g transform="translate(${x} ${y}) scale(${sc})">`;
  const bl=[[-50,10,40],[0,-18,50],[48,6,40],[-20,30,36],[28,32,36]];
  bl.forEach((b,i)=>{s+=`<circle cx="${b[0]+Math.sin(t*5+i)*3}" cy="${b[1]+Math.cos(t*4+i)*3}" r="${b[2]}" fill="#86C97A" stroke="#2F5A2A" stroke-width="6"/>`});
  bl.forEach((b,i)=>{s+=`<circle cx="${b[0]+Math.sin(t*5+i)*3}" cy="${b[1]+Math.cos(t*4+i)*3}" r="${b[2]-6}" fill="#86C97A"/>`});
  if(mood==='angry'){s+=`<path d="M-34 -16 L-8 -4 M34 -16 L8 -4" stroke="${O}" stroke-width="7" stroke-linecap="round"/><circle cx="-18" cy="6" r="9" fill="#fff" stroke="${O}" stroke-width="4"/><circle cx="18" cy="6" r="9" fill="#fff" stroke="${O}" stroke-width="4"/><circle cx="-16" cy="8" r="4" fill="${O}"/><circle cx="16" cy="8" r="4" fill="${O}"/><path d="M-14 34 Q0 24 14 34" stroke="${O}" stroke-width="5" fill="none"/>`;}
  else {s+=`<path d="M-34 -12 L-8 0 M34 -12 L8 0" stroke="${O}" stroke-width="7" stroke-linecap="round"/><circle cx="-18" cy="10" r="9" fill="#FFF36B" stroke="${O}" stroke-width="4"/><circle cx="18" cy="10" r="9" fill="#FFF36B" stroke="${O}" stroke-width="4"/><circle cx="-16" cy="12" r="4" fill="${O}"/><circle cx="16" cy="12" r="4" fill="${O}"/><path d="M-22 28 Q0 46 22 28 Z" fill="#7A1F2B" stroke="${O}" stroke-width="4"/><path d="M-14 30 l4 7 l4 -7 M6 30 l4 7 l4 -7" fill="#fff"/>`;}
  return s+`</g>`;
}
function puff(x,y,r,op,col='#C9CED4'){return `<circle cx="${x}" cy="${y}" r="${r}" fill="${col}" stroke="${O}" stroke-width="3" opacity="${op}"/>`}
function puffs(x,y,t,t0,n=5,col){
  let s='';if(t<t0)return s;
  for(let i=0;i<n;i++){const k=((t-t0)*1.2+i/n)%1;
    s+=puff(x+Math.sin(i*2.3+k*4)*16,y-k*90,10+k*18,(1-k)*.9,col);}
  return s;
}
function plate(x,y,hot,t,perfect){
  let s=`<g transform="translate(${x} ${y})">`;
  s+=`<rect x="-60" y="-20" width="120" height="40" rx="6" fill="#9AA3AB" stroke="${O}" stroke-width="5"/>`;
  if(perfect){s+=`<rect x="-46" y="-8" width="92" height="14" rx="7" fill="#D9E2EA" stroke="${O}" stroke-width="3"/>`;for(let i=0;i<9;i++)s+=`<path d="M${-42+i*10} -6 q5 6 0 12" stroke="#8E9AA6" stroke-width="2.5" fill="none"/>`;}
  else s+=`<rect x="-46" y="-8" width="92" height="14" rx="7" fill="${hot?'#FF8C1A':'#B9C2CA'}" stroke="${O}" stroke-width="3"/>`;
  if(hot){s+=`<rect x="-60" y="-20" width="120" height="40" rx="6" fill="#FF5A1F" opacity="${.25+.1*Math.sin(t*12)}"/>`;

    s += `<path d="${d}" fill="none" stroke="${O}" stroke-width="30" stroke-linecap="round"/><path d="${d}" fill="none" stroke="#2E8B57" stroke-width="20" stroke-linecap="round"/>`; }
  return s;
}
function fish(t, i, y, dir = 1, col = '#F5A524') { const x = dir > 0 ? ((t * 90 + rnd(i) * 1400) % 1400) - 200 : 1200 - ((t * 90 + rnd(i) * 1400) % 1400);
  return `<g transform="translate(${x} ${y + Math.sin(t * 3 + i) * 14}) scale(${dir} 1)" stroke="${O}" stroke-width="5"><path d="M-50 0 Q0 -36 46 0 Q0 36 -50 0Z" fill="${col}"/><path d="M-46 0 L-80 -26 L-80 26Z" fill="${col}"/><circle cx="22" cy="-6" r="6" fill="#fff" stroke-width="3"/><circle cx="24" cy="-6" r="2.5" fill="${O}" stroke="none"/></g>`; }
function bubbles(t, x0, y0, n = 6, spread = 40, speed = 160) { let s = ''; for (let i = 0; i < n; i++) { const q = (t * speed / 600 + rnd(i + x0)) % 1, y = y0 - q * 600, x = x0 + Math.sin(t * 4 + i) * spread * q + (rnd(i) - .5) * spread;
  s += `<circle cx="${x}" cy="${y}" r="${5 + rnd(i + 3) * 10}" fill="#BFEFFF" fill-opacity=".25" stroke="#E6F8FF" stroke-width="3" opacity="${1 - q}"/>`; } return s; }
function amb(t) { return fish(t, 1, 420, 1) + fish(t, 2, 700, -1, '#FF6B75') + fish(t, 3, 1180, 1, '#FFE066') + bubbles(t, 300, 1500, 5, 60, 120) + bubbles(t, 820, 1500, 5, 60, 140); }
/* diver helmet + hose drawn over the cartoon welder's head */
function diver(pro, t) { const [hx, hy] = localPt(pro, 150, 170), s = pro.s;
  return `<path d="M${hx} ${hy - 110 * s} Q${hx + 60} ${hy - 500} ${hx + 260} -40" fill="none" stroke="${O}" stroke-width="${22 * s}"/><path d="M${hx} ${hy - 110 * s} Q${hx + 60} ${hy - 500} ${hx + 260} -40" fill="none" stroke="#E8C547" stroke-width="${12 * s}"/>
  <g transform="translate(${hx} ${hy}) scale(${s})" stroke="${O}" stroke-width="7"><rect x="-120" y="70" width="240" height="50" rx="16" fill="#B87333"/><path d="M-122 0 A122 122 0 1 0 122 0 A122 122 0 1 0 -122 0Z M-80 0 A80 80 0 1 1 80 0 A80 80 0 1 1 -80 0Z" fill="#D4943F" fill-rule="evenodd"/><path d="M-80 -70 Q-40 -110 20 -104" fill="none" stroke="#F3C27A" stroke-width="12" stroke-linecap="round"/>
  <circle r="80" fill="#9FE8FF" fill-opacity=".18" stroke-width="12"/><circle r="80" fill="none" stroke="#B87333" stroke-width="6"/><path d="M-40 -50 Q-10 -66 20 -60" fill="none" stroke="#fff" stroke-width="8" opacity=".7" stroke-linecap="round"/>
  ${[[-104, -40], [104, -40], [-104, 50], [104, 50], [0, -112]].map(([x, y]) => `<circle cx="${x}" cy="${y}" r="11" fill="#8C5A22" stroke-width="4"/>`).join('')}</g>` + bubbles(t, hx + 90, hy - 80, 4, 20, 220); }
function arcWater(x, y, t, r) { return `<circle cx="${x}" cy="${y}" r="${r * 2.2}" fill="#38E1FF" opacity=".12"/>` + arcAt(x, y, t, r); }
function boom(x, y, p, word) { if (p <= 0) return ''; return `<g transform="translate(${x} ${y}) scale(${p}) rotate(-8)">${star(0, 0, 240, '#FFE066', 0)}${star(0, 0, 160, '#FF8C1A', 20)}${txt(0, 44, word, 130, '#E63946')}</g>`; }

function render(t) {
  let bg = '', back = '', front = '', over = '', title = ''; let sh = 0, z = 1;
  const pro = { type: 'pro', x: 380, y: 1500, s: 1.25, expr: 'happy', armR: -20, armL: 20, hop: Math.sin(t * 1.6) * 8, visor: 0 };
  const k = KEYS.reduce((a, x) => t >= T[x] ? x : a, KEYS[0]);
  const ki = KEYS.indexOf(k), span = lin(t, T[k], KEYS[ki + 1] ? T[KEYS[ki + 1]] : T.end);
  let showDiver = true;
  if (k === 'hook') {
    const lit = lin(t, W('hook', 3), W('hook', 6));
    bg = sea(t, 1) + `<rect width="1080" height="1920" fill="#000" opacity="${.75 - .6 * lit}"/>`;
    back += steel(560, 1040, 1180, 90);
    pro.hold = 'holder'; pro.armR = -62; pro.x = 420; pro.expr = t > W('hook', 22) ? 'scared' : 'smug';
    const [ax, ay] = tipOf(pro); front += arcWater(ax, ay, t, 120) + bubbles(t, ax, ay, 10, 30, 260);
    sh = shake(t, 0, 18, .5) + shake(t, W('hook', 22), 14, .45); z = 1.14 + .06 * eIO(span);
    title = `<g transform="translate(540 260) scale(${pop(t, -.4)})"><text y="0" font-size="150" fill="#FF8C1A" text-anchor="middle" stroke="${O}" stroke-width="18" paint-order="stroke">FUEGO…</text><text y="110" font-size="84" fill="#38E1FF" text-anchor="middle" stroke="${O}" stroke-width="14" paint-order="stroke">BAJO EL AGUA</text></g>`;
    if (t > W('hook', 13)) over += pill(800, 560, pop(t, W('hook', 13)), 'FONDO DEL MAR', '#14162D', 40);
    over += stamp('PELIGROSO', 540, 700, -6, pop(t, W('hook', 22)), '#E63946');
    if (lit > 0) over += `<g opacity="${lit}">${amb(t)}</g>`;
  } else if (k === 'pregunta') {
    bg = sea(t); back += steel(560, 1040, 1180, 90);
    pro.hold = 'holder'; pro.armR = -62; pro.x = 420; pro.expr = 'scared';
    const [ax, ay] = tipOf(pro); front += arcWater(ax, ay, t, 70 + 40 * Math.abs(Math.sin(t * 9))) + bubbles(t, ax, ay, 8, 30, 260);
    over += `<g transform="translate(540 330) scale(${pop(t, T.pregunta + .05)})">${txt(0, 0, '¿POR QUÉ', 110, '#fff')}${txt(0, 120, 'NO SE APAGA?', 100, '#FFE066')}</g>`;
    const q = pop(t, W('pregunta', 4)); if (q > 0) over += `<g transform="translate(870 640) scale(${q * (1 + .08 * Math.sin(t * 10))}) rotate(12)">${txt(0, 60, '?', 220, '#FF2E63')}</g>`;
    if (t > W('pregunta', 8)) { const p = eOut(lin(t, W('pregunta', 8), SH.pregunta.end)); over += `<circle cx="${ax}" cy="${ay}" r="${60 + p * 1400}" fill="none" stroke="#fff" stroke-width="${30 * (1 - p) + 4}" opacity="${1 - p * .6}"/>`; }
    over += amb(t);
  } else if (k === 'burbuja') {
    bg = sea(t, 1); showDiver = false;
    title = bigTitle(0, 'LA BURBUJA', pop(t, T.burbuja + .05), 230);
    const X = 540, Y = 1150;
    over += steel(100, 980, Y, 110) + bubbles(t, 260, Y, 6, 40, 150) + bubbles(t, 820, Y, 6, 40, 150);
    over += holder(X - 10, Y - 120, 18, 1.4).replace(/fill="#F5C518"/, 'fill="#F5C518"');
    const B = eOut(lin(t, W('burbuja', 16), W('burbuja', 18)));
    if (t > W('burbuja', 6)) over += bubbles(t, X, Y - 20, 18, 120 * (1 - B) + 30, 380);
    if (t > W('burbuja', 13)) for (let i = 0; i < 5; i++) { const q = (t * .9 + i / 5) % 1; over += `<circle cx="${X - 20 + Math.sin(i * 2 + t) * 60 * q}" cy="${Y - 130 - q * 120}" r="${24 + q * 26}" fill="#C9CED4" opacity="${.7 * (1 - q)}"/>`; }
    if (B > 0) over += `<path d="M${X - 300 * B} ${Y} A${300 * B} ${280 * B} 0 0 1 ${X + 300 * B} ${Y}Z" fill="#BFEFFF" fill-opacity=".28" stroke="#E6F8FF" stroke-width="10" stroke-dasharray="22 12" stroke-dashoffset="${-t * 40}"/><ellipse cx="${X - 120 * B}" cy="${Y - 200 * B}" rx="${50 * B}" ry="${22 * B}" fill="#fff" opacity=".5" transform="rotate(-30 ${X - 120 * B} ${Y - 200 * B})"/>`;
    over += arcWater(X + 20, Y - 6, t, 90) + puddle(X + 20, Y + 2, 44);
    over += pill(820, 760, pop(t, W('burbuja', 4)), 'MILES DE GRADOS', '#FF8C1A', 38);
    if (t > W('burbuja', 6) && t < W('burbuja', 16)) over += pill(260, 860, pop(t, W('burbuja', 6)), 'EL AGUA HIERVE', '#38E1FF', 38);
    if (t > W('burbuja', 13) && t < W('burbuja', 18)) over += pill(800, 900, pop(t, W('burbuja', 13)), 'GAS DEL FORRO', '#C9CED4', 38);
    if (t > W('burbuja', 18)) over += pill(X, Y + 180, pop(t, W('burbuja', 18)), 'BURBUJA', '#38E1FF', 56);
    over += stamp('EL ARCO VIVE', X, 470, -5, pop(t, W('burbuja', 25)), '#2ECC71');
  } else if (k === 'electrodo') {
    bg = sea(t); showDiver = false;
    title = bigTitle(0, 'ELECTRODO', pop(t, T.electrodo + .05), 230);
    const cy = 800, p = eOut(lin(t, T.electrodo, T.electrodo + .6));
    over += `<g transform="translate(${mix(-700, 0, p)} 0)" stroke="${O}" stroke-width="7">
      <rect x="140" y="${cy - 70}" width="760" height="140" rx="20" fill="#E9D8A6"/><rect x="60" y="${cy - 22}" width="140" height="44" rx="8" fill="#7E8389"/><path d="M200 ${cy} L900 ${cy}" stroke="#7E8389" stroke-width="30"/></g>`;
    const c = eOut(lin(t, W('electrodo', 7), W('electrodo', 8)));
    if (c > 0) over += `<rect x="${140 - 14}" y="${cy - 84}" width="${(760 + 28) * c}" height="168" rx="28" fill="#38E1FF" fill-opacity=".35" stroke="#38E1FF" stroke-width="8"/><path d="M180 ${cy - 60} L${180 + 680 * c} ${cy - 60}" stroke="#fff" stroke-width="10" opacity=".7" stroke-linecap="round"/>`;
    over += pill(520, 600, pop(t, W('electrodo', 5)), 'FORRO', '#E9D8A6', 44) + pill(520, 1010, pop(t, W('electrodo', 8)), 'SELLADO · IMPERMEABLE', '#38E1FF', 40);
    if (t > W('electrodo', 11)) for (let i = 0; i < 7; i++) { const q = ((t - W('electrodo', 11)) * 1.4 + i / 7) % 1, x = 200 + i * 100, yy = q < .5 ? mix(420, cy - 90, q * 2) : mix(cy - 90, 520, (q - .5) * 2);
      over += `<path d="M${x} ${yy - 26} Q${x + 18} ${yy} ${x} ${yy + 16} Q${x - 18} ${yy} ${x} ${yy - 26}Z" fill="#9FE8FF" stroke="${O}" stroke-width="4"/>`; }
    if (t > W('electrodo', 16)) over += check(540, 1220, pop(t, W('electrodo', 16)), 'EL AGUA NO ENTRA');
    over += amb(t);
  } else if (k === 'corriente') {
    const up = t > W('corriente', 7);
    if (!up) {
      bg = sea(t); showDiver = false; title = bigTitle(0, 'CORRIENTE', pop(t, T.corriente + .05), 230);
      const card = (x, p, head, col, ac, ok) => p <= 0 ? '' : `<g transform="translate(${x} 860) scale(${p})"><rect x="-220" y="-300" width="440" height="600" rx="34" fill="#fff" stroke="${O}" stroke-width="8"/><rect x="-220" y="-300" width="440" height="130" rx="34" fill="${col}" stroke="${O}" stroke-width="8"/>${txt(0, -205, head, 70, '#fff')}</g><g transform="translate(${x} 860) scale(${p})">${wave(-170, 170, 20, 60, t, ac)}</g>` + (ok ? check(x, 1080, p, '') : redX(x, 1080, 70, p));
      over += card(290, pop(t, W('corriente', 3)), 'DIRECTA', '#2ECC71', false, true) + card(790, pop(t, W('corriente', 5)), 'ALTERNA', '#E63946', true, false);
      over += amb(t);
    } else {
      // surface: boat with the knife switch; cable down to the diver
      const on = t > W('corriente', 23);
      bg = sea(t) + `<rect width="1080" height="560" fill="#8ED1EA"/><circle cx="880" cy="160" r="80" fill="#FFE066" stroke="${O}" stroke-width="6"/><path d="M0 560 ${[...Array(28)].map((_, i) => `Q${i * 40 + 20} ${560 + (i % 2 ? 14 : -14) + Math.sin(t * 3 + i) * 6} ${i * 40 + 40} 560`).join(' ')} L1080 560" fill="#1C8FB0" stroke="${O}" stroke-width="6"/>`;
      back += `<g stroke="${O}" stroke-width="7"><path d="M120 470 L960 470 L880 580 L200 580Z" fill="#E63946"/><rect x="300" y="360" width="300" height="110" rx="10" fill="#fff"/><rect x="330" y="385" width="70" height="50" rx="8" fill="#9FE3F5"/></g>`;
      const a = on ? 0 : -50; back += `<g stroke="${O}" stroke-width="7"><rect x="660" y="390" width="160" height="80" rx="10" fill="#5A6170"/><g transform="rotate(${a} 690 420)"><rect x="690" y="410" width="140" height="20" rx="8" fill="#B9C2CA"/><rect x="820" y="396" width="24" height="48" rx="8" fill="#E63946"/></g></g>`;
      back += `<path d="M740 470 Q700 900 ${pro.x + 120} 1200" fill="none" stroke="${O}" stroke-width="16"/><path d="M740 470 Q700 900 ${pro.x + 120} 1200" fill="none" stroke="${on ? '#FFE066' : '#3B4252'}" stroke-width="8"/>`;
      if (on && t < W('corriente', 23) + .6) back += bolt(740, 480, 700, 900, t) + bolt(700, 900, pro.x + 120, 1200, t + .2);
      pro.hold = 'holder'; pro.armR = on ? -62 : -150; pro.x = 300; pro.s = 1.05; pro.expr = on ? 'smug' : 'happy';
      back += steel(500, 1040, 1250, 80);
      if (on) { const [ax, ay] = tipOf(pro); front += arcWater(ax, ay, t, 80); }
      title = `<g transform="translate(540 120) scale(${pop(t, W('corriente', 7))})">${chip(0, 0, 'ARRIBA, EN EL BARCO', '#14162D', '#fff', 46, 'middle')}</g>`;
      over += pill(740, 320, pop(t, W('corriente', 13)), 'INTERRUPTOR', '#FFE066', 38);
      if (t > W('corriente', 15) && !on) over += bubble(620, 800, pop(t, W('corriente', 15)), '¡DALE CORRIENTE!');
      over += boom(760, 300, on && t < W('corriente', 23) + 1 ? pop(t, W('corriente', 23)) * .5 : 0, 'CLACK');
      sh = shake(t, W('corriente', 23), 14, .4);
      over += fish(t, 2, 900, -1, '#FF6B75') + bubbles(t, 820, 1500, 5, 60, 140);
    }
  } else if (k === 'peligro') {
    bg = sea(t, 1); title = bigTitle(0, '3 PELIGROS', pop(t, T.peligro + .05), 230);
    const P2 = W('peligro', 12), P3 = W('peligro', 25), boomT = W('peligro', 24);
    pro.hold = 'holder'; pro.armR = -62; pro.x = 330;
    if (t < P2) { pro.expr = t > W('peligro', 7) ? 'pain' : 'scared'; back += steel(520, 1040, 1180, 90); const [ax, ay] = tipOf(pro);
      front += arcWater(ax, ay, t, 80); if (t > W('peligro', 7)) for (let i = 0; i < 4; i++) front += bolt(ax, ay, ax + Math.cos(i * 1.6 + t * 3) * 380, ay + Math.sin(i * 1.6 + t * 3) * 380, t + i);
      over += pill(540, 470, pop(t, W('peligro', 6)), '1 · ELECTRICIDAD', '#FFE066', 50); sh = shake(t, W('peligro', 7), 8, 1.2) * (t < P2 ? 1 : 0); }
    else if (t < P3) { pro.expr = t > boomT ? 'pain' : 'scared'; pro.x = 260; pro.armR = -100;
      back += `<rect x="460" y="760" width="620" height="90" fill="#C9A227" stroke="${O}" stroke-width="7"/>`;
      const g = eOut(lin(t, W('peligro', 14), W('peligro', 18))), gone = t > boomT;
      if (!gone && g > 0) back += `<ellipse cx="760" cy="${850 + 50 * g}" rx="${200 * g}" ry="${60 * g}" fill="#BFEFFF" fill-opacity=".45" stroke="#E6F8FF" stroke-width="8"/>` + (t > W('peligro', 16) ? txt(760, 890, 'H₂ + O₂', 52, '#fff') : '');
      over += pill(540, 470, pop(t, P2), '2 · EXPLOSIÓN', '#FF8C1A', 50);
      if (t > W('peligro', 21) && !gone) over += pill(760, 1000, pop(t, W('peligro', 21)), 'ATRAPADA', '#E63946', 40);
      over += boom(760, 860, pop(t, boomT) * (t < boomT + 1.3 ? 1 : 0), 'BOOM'); sh = shake(t, boomT, 30, .6); }
    else { pro.expr = 'pain'; pro.armR = -150; pro.hop = -eIO(lin(t, W('peligro', 33), W('peligro', 36))) * 500;
      const p = pop(t, P3); over += pill(540, 470, p, '3 · LA PRESIÓN', '#38E1FF', 50);
      for (let i = 0; i < 6; i++) { const a = i * Math.PI / 3, [hx, hy] = localPt(pro, 150, 300), r = 300 - 40 * Math.abs(Math.sin(t * 4)); over += `<g transform="translate(${hx + Math.cos(a) * r} ${hy + Math.sin(a) * r}) rotate(${a * 180 / Math.PI + 180})" opacity="${Math.min(p, 1)}"><path d="M-40 0 L30 0 M10 -22 L34 0 L10 22" fill="none" stroke="#fff" stroke-width="14" stroke-linecap="round" stroke-linejoin="round"/></g>`; }
      if (t > W('peligro', 33)) over += pill(800, 760, pop(t, W('peligro', 33)), 'ENFERMA AL SUBIR', '#E63946', 38) + `<g transform="translate(900 1000) scale(${pop(t, W('peligro', 33))})"><path d="M0 120 L0 -60 M-40 -20 L0 -70 L40 -20" fill="none" stroke="#fff" stroke-width="18" stroke-linecap="round" stroke-linejoin="round"/></g>`; }
    over += amb(t);
  } else if (k === 'calidad') {
    const dry = t > W('calidad', 16);
    if (!dry) { bg = sea(t); showDiver = false; title = bigTitle(0, 'ENFRÍA DE GOLPE', pop(t, T.calidad + .05), 230);
      const c = eOut(lin(t, W('calidad', 4), W('calidad', 8))), col = c < .5 ? '#FF8C1A' : '#7FA6AF';
      over += steel(100, 980, 900, 120);
      for (let x = 180, i = 0; x < 900; x += 40, i++) over += `<ellipse cx="${x}" cy="900" rx="40" ry="34" fill="${i % 2 ? col : (c < .5 ? '#FFB347' : '#93B5BD')}" stroke="${O}" stroke-width="4"/>`;
      if (c < .5) over += `<rect x="140" y="860" width="800" height="80" fill="#FFE066" opacity=".35"/>`;
      if (c > 0) for (let i = 0; i < 8; i++) { const q = (t * .8 + i / 8) % 1; over += `<circle cx="${200 + i * 90 + Math.sin(t * 3 + i) * 20}" cy="${850 - q * 260}" r="${20 + q * 30}" fill="#fff" opacity="${.5 * (1 - q) * Math.min(c * 2, 1)}"/>`; }
      if (c > .5) over += `<g transform="translate(540 640) scale(${pop(t, W('calidad', 7))})">${[0, 60, 120].map(a => `<path d="M0 -70 L0 70" stroke="#fff" stroke-width="14" stroke-linecap="round" transform="rotate(${a})"/>`).join('')}</g>` + pill(540, 1120, pop(t, W('calidad', 7)), 'MÁS FRÁGIL', '#E63946', 44);
      over += amb(t);
    } else { bg = sea(t, 1); title = bigTitle(0, 'CÁMARA SECA', pop(t, W('calidad', 16)), 230);
      back += `<rect x="40" y="620" width="1000" height="880" rx="60" fill="#5A6170" stroke="${O}" stroke-width="10"/><rect x="90" y="680" width="900" height="760" rx="40" fill="#F3E9D2" stroke="${O}" stroke-width="8"/>`;
      for (const [x, y] of [[70, 650], [1010, 650], [70, 1470], [1010, 1470]]) back += `<circle cx="${x}" cy="${y}" r="16" fill="#8D99A6" stroke="${O}" stroke-width="5"/>`;
      back += tableTop(560, 1180, 400) + `<rect x="600" y="1140" width="320" height="44" rx="6" fill="#A9B3BC" stroke="${O}" stroke-width="5"/>`;
      pro.hold = 'holder'; pro.armR = -62; pro.x = 440; pro.visor = 1; pro.hop = idle(t); showDiver = false;
      const [ax, ay] = tipOf(pro); front += arcAt(ax, ay, t, 90) + longBead(640, ax, 1150);
      over += check(900, 470, pop(t, W('calidad', 22)), 'SIN AGUA') + amb(t);
    }
  } else {
    bg = sea(t); pro.x = 230; pro.armR = -155; pro.expr = 'happy'; pro.hop = -Math.abs(Math.sin(t * 4)) * 14;
    over += bubble(560, 420, pop(t, T.cierre + .1), '¿TE TIRARÍAS?');
    [['SÍ ME TIRO', '#2ECC71', 12], ['NI LOCO', '#E63946', 14]].forEach(([s, c, w], i) => { const p = pop(t, W('cierre', w)); if (p > 0) over += `<g transform="translate(720 ${660 + i * 170}) scale(${p})"><rect x="-250" y="-66" width="500" height="132" rx="66" fill="${c}" stroke="${O}" stroke-width="7"/>${txt(0, 20, s, 60, '#fff')}</g>`; });
    for (let i = 0; i < 6; i++) { const q = ((t * .5) + rnd(i)) % 1; if (t > W('cierre', 12)) over += heart(150 + rnd(i + 3) * 800, 1400 - q * 900, 26, 1 - q); }
    const wp = pop(t, W('cierre', 18)); if (wp > 0) over += `<g transform="translate(600 1150) scale(${wp * (1 + .05 * Math.sin(t * 12))}) rotate(-6)">${txt(0, 0, '¡ESTAMOS', 110, '#FFE066')}${txt(0, 110, 'ACTIVOS!', 110, '#FFE066')}</g>`;
    over += amb(t);
  }
  let svg = DEFS + `<g transform="translate(${sh} 0)">${bg}<g transform="translate(540 1500) scale(${z}) translate(-540 -1500)">${back}${pro.hide || (k === 'burbuja' || k === 'electrodo' || (k === 'corriente' && t < W('corriente', 7)) || (k === 'calidad' && t < W('calidad', 16))) ? '' : character(pro, t) + (showDiver ? diver(pro, t) : '')}${front}</g>${over}</g>`;
  svg += `<text x="1040" y="64" font-size="30" fill="#fff" text-anchor="end" stroke="${O}" stroke-width="6" paint-order="stroke">@luisgabb17</text>`;
  svg += title + caption(t);
  document.getElementById('s').innerHTML = svg;
}
window.render = render; render(0);
</script></body></html>
