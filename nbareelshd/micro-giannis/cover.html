<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="fonts/fonts.css">
<style>html,body{margin:0;background:#000}canvas{display:block}</style></head><body><canvas id="c" width="1080" height="1920"></canvas>
<script type="module">
// Reel cover in the home-stage look: everything that must read sits in the 3:4 centre (y 240–1680) the profile grid keeps
const W = 1080, H = 1920, TAU = Math.PI * 2, P = { ink: '#1a1030', mag: '#ff2e88', vio: '#6b2bd9', deep: '#2a0f5c', gold: '#ffc928', white: '#fff', hero: '#2f7bff', orange: '#ff7a1a' };
await Promise.all(['Titan', 'Lilita', 'VT'].map(f => document.fonts.load(`40px ${f}`)));
const g = document.getElementById('c').getContext('2d');
const out = (txt, x, y, font, fill, lw, shadow, sd = [8, 14]) => { g.save(); g.font = font; g.textAlign = 'center'; g.lineJoin = 'round';
  if (shadow) { g.fillStyle = g.strokeStyle = shadow; g.lineWidth = lw; g.strokeText(txt, x + sd[0], y + sd[1]); g.fillText(txt, x + sd[0], y + sd[1]); }
  g.strokeStyle = P.ink; g.lineWidth = lw; g.strokeText(txt, x, y); g.fillStyle = fill; g.fillText(txt, x, y); g.restore(); };
g.fillStyle = P.deep; g.fillRect(0, 0, W, H);
g.save(); g.translate(W / 2, 900); g.fillStyle = P.vio; for (let i = 0; i < 18; i++) { g.beginPath(); g.moveTo(0, 0); g.arc(0, 0, 2000, i / 18 * TAU, (i + .5) / 18 * TAU); g.fill(); } g.restore();
out('GIANNIS', W / 2, 400, '96px Titan', P.white, 16, P.mag, [6, 10]);
// the 77 tile, as in the terminal game
g.save(); g.translate(W / 2, 830); g.rotate(-.05);
g.fillStyle = P.ink; g.beginPath(); g.roundRect(-250, -200, 520, 420, 40); g.fill();
g.fillStyle = P.hero; g.strokeStyle = P.ink; g.lineWidth = 14; g.beginPath(); g.roundRect(-270, -220, 520, 420, 40); g.fill(); g.stroke();
g.font = '420px VT'; g.fillStyle = '#120a02'; g.textAlign = 'center'; g.fillText('34', -10, 140); g.restore();
// the command burst
g.save(); g.translate(W / 2, 1210); g.rotate(-.07); g.transform(1, 0, -.12, 1, 0, 0);
g.fillStyle = P.gold; g.strokeStyle = P.ink; g.lineWidth = 12; g.beginPath();
for (let i = 0; i <= 28; i++) { const a = i / 28 * TAU, r = i % 2 ? .78 : 1.04; g.lineTo(Math.cos(a) * 520 * r, Math.sin(a) * 150 * r - 40); } g.closePath(); g.fill(); g.stroke();
out('¡TRASPASADO!', 0, 0, '128px Titan', P.white, 22, P.mag); g.restore();
out('Y SE ACABÓ UNA ERA', W / 2, 1490, '76px Titan', P.gold, 14, P.ink, [5, 8]);
// lives, as on the stage: one already lost
for (let i = 0; i < 3; i++) { const x = W / 2 - 92 + i * 92, y = 1600; g.save(); g.globalAlpha = i < 2 ? 1 : .3; g.fillStyle = P.orange; g.strokeStyle = P.ink; g.lineWidth = 7; g.beginPath(); g.arc(x, y, 34, 0, TAU); g.fill(); g.stroke(); g.lineWidth = 4; g.beginPath(); g.moveTo(x - 34, y); g.lineTo(x + 34, y); g.moveTo(x, y - 34); g.lineTo(x, y + 34); g.stroke(); g.restore(); }
window.READY = true;
</script></body></html>
