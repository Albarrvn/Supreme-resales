<!doctype html>
<html><head><meta charset="utf-8">
<style>html,body{margin:0;width:1080px;height:1080px;overflow:hidden;background:#0B1C22}svg{display:block}</style></head>
<body>
<svg id="s" xmlns="http://www.w3.org/2000/svg" width="1080" height="1080" viewBox="0 0 1080 1080"></svg>
<script src="bust.js"></script><script>
// Foto de perfil navideña: el soldador (estilo muñequitos de los reels) con gorro de Santa sobre la careta
const rnd = i => { const x = Math.sin(i * 127.1 + 311.7) * 43758.5453; return x - Math.floor(x); };
let s = `<defs>
<radialGradient id="bg" cx="50%" cy="42%" r="70%"><stop offset="0" stop-color="#1F7A8C"/><stop offset=".55" stop-color="#14505C"/><stop offset="1" stop-color="#0B1C22"/></radialGradient>
<radialGradient id="glow" cx="50%" cy="50%" r="50%"><stop offset="0" stop-color="#fff" stop-opacity="1"/><stop offset=".3" stop-color="#9FE8FF" stop-opacity=".8"/><stop offset="1" stop-color="#38E1FF" stop-opacity="0"/></radialGradient>
<radialGradient id="warm" cx="50%" cy="50%" r="50%"><stop offset="0" stop-color="#FFE066" stop-opacity=".9"/><stop offset="1" stop-color="#FF8C2A" stop-opacity="0"/></radialGradient>
</defs><rect width="1080" height="1080" fill="url(#bg)"/>`;
// snowflakes
for (let i = 0; i < 46; i++) { const x = rnd(i) * 1080, y = rnd(i + 50) * 1080, r = 4 + rnd(i + 99) * 9; s += `<circle cx="${x}" cy="${y}" r="${r}" fill="#fff" opacity="${.35 + rnd(i + 7) * .5}"/>`; }
// string lights arc across the top
let d = 'M40 170 Q540 330 1040 170'; s += `<path d="${d}" fill="none" stroke="${O}" stroke-width="6"/>`;
const LC = ['#E63946', '#FFE066', '#2ECC71', '#38E1FF', '#FF8C2A'];
for (let i = 0; i < 13; i++) { const u = (i + .5) / 13, x = (1 - u) * (1 - u) * 40 + 2 * u * (1 - u) * 540 + u * u * 1040, y = (1 - u) * (1 - u) * 170 + 2 * u * (1 - u) * 330 + u * u * 170, c = LC[i % 5];
  s += `<circle cx="${x}" cy="${y + 26}" r="36" fill="${c}" opacity=".25"/><rect x="${x - 9}" y="${y}" width="18" height="16" rx="3" fill="#3B4252" stroke="${O}" stroke-width="4"/><ellipse cx="${x}" cy="${y + 30}" rx="15" ry="20" fill="${c}" stroke="${O}" stroke-width="5"/><ellipse cx="${x - 5}" cy="${y + 24}" rx="4" ry="7" fill="#fff" opacity=".7"/>`; }
s += bustSVG();
// welding spark shaped as a Christmas star, bottom right
s += `<circle cx="860" cy="860" r="150" fill="url(#warm)"/><circle cx="860" cy="860" r="110" fill="url(#glow)"/>`;
const star = (x, y, r, f) => { let p = ''; for (let i = 0; i < 10; i++) { const a = -Math.PI / 2 + i * Math.PI / 5, rr = i % 2 ? r * .45 : r; p += (i ? 'L' : 'M') + (x + Math.cos(a) * rr).toFixed(1) + ' ' + (y + Math.sin(a) * rr).toFixed(1); } return `<path d="${p}Z" fill="${f}" stroke="${O}" stroke-width="7" stroke-linejoin="round"/>`; };
s += star(860, 860, 74, '#FFE066');
for (let i = 0; i < 9; i++) { const a = i * .7 + .3, r = 120 + rnd(i) * 70; s += star(860 + Math.cos(a) * r, 860 + Math.sin(a) * r * .9, 10 + rnd(i + 3) * 10, i % 2 ? '#FFE066' : '#fff'); }
// holly at the lower left
s += `<g stroke="${O}" stroke-width="6" stroke-linejoin="round"><path d="M150 880 Q190 820 250 840 Q230 880 250 920 Q190 920 150 880Z" fill="#2E8B57"/><path d="M150 880 Q120 810 160 760 Q190 810 230 800 Q200 850 150 880Z" fill="#2ECC71"/>
<circle cx="150" cy="880" r="20" fill="#E63946"/><circle cx="178" cy="900" r="18" fill="#E63946"/><circle cx="130" cy="906" r="17" fill="#E63946"/></g>`;
document.getElementById('s').innerHTML = s;
</script></body></html>
